[workspace]
resolver = "2"
members = ["crates/sj-game", "crates/sj-emu", "crates/sj", "crates/sj-lab"]
# sj-lab is a research tool; leaving it out of the defaults keeps plain `cargo run` on the game.
default-members = ["crates/sj-game", "crates/sj-emu", "crates/sj"]

[workspace.package]
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/BeubeuCode/sj-pc"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
